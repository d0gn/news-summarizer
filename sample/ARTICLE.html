<!DOCTYPE html>

  <!-- Tailwind CSS CDN -->

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#F5F3FF',
              100: '#EDE9FE',
              500: '#8B5CF6',
              600: '#7C3AED',
              700: '#6D28D9',
            }
          }
        }
      }

<body class="bg-slate-50 text-slate-800 dark:bg-[#0B0F19] dark:text-slate-100 antialiased selection:bg-purple-500 selection:text-white transition-colors duration-200 min-h-screen relative overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- 아이콘 컴포넌트 ---
    const Icon = ({ name, className = "w-4 h-4", fill = "none" }) => {
      const icons = {
        arrowLeft: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />,
        sparkles: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />,
        bookmark: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />,
        share: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />,
        external: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />,
        sun: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />,
        moon: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />,
        clock: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />,
        check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
      };
      return (
        <svg className={className} fill={fill} stroke="currentColor" viewBox="0 0 24 24">
          {icons[name] || null}
        </svg>
      );
    };

    // --- 기사 상세 목데이터 ---
    const articleDetailData = {
      id: "art-1",
      title: "오픈AI, 차세대 복합 추론 모델 'o3' 전격 공개… 코딩·수학 벤치마크 92.4% 달성",
      publisher: "테크크런치 코리아",
      publisher_logo: "TC",
      category: "IT/테크",
      published_at: "2026. 10. 06. 23:10",
      time_ago: "24분 전",
      read_time: "3분 분량",
      author: "인공지능 특별취재팀",
      origin_url: "https://techcrunch.com",
      is_bookmarked: false,
      core_message: "기존 모델 대비 다단계 추론 토큰 비용을 40% 절감하며 복잡한 자율 코딩 에이전트의 완성도를 상용화 수준으로 격상시킴.",
      summary: [
        "시스템 내부 'Chain of Thought(사고 연쇄)' 과정을 자율 조율하여 불필요한 토큰 소모와 응답 지연율 40% 대폭 개선.",
        "STEM 분야 및 고난도 알고리즘 대회 수준 테스트에서 최고 정답률(92.4%)을 기록하며 압도적 추론 역량 입증.",
        "기업용 엔터프라이즈 API는 다음 달 중순부터 순차 롤아웃되며 기존 가격 정책을 유지해 실무 도입 장벽 완화."
      ],
      tags: ["AI", "OpenAI", "추론모델", "차세대AI", "SW엔지니어링"],
      content_paragraphs: [
        "인공지능 연구기관 오픈AI(OpenAI)가 다단계 문제 해결과 복합 논리 추론 능력을 비약적으로 끌어올린 차세대 플래그십 AI 모델 'o3'를 전격 발표했습니다. 이번 모델은 단순 텍스트 예측과 언어 생성을 넘어 스스로 가설을 검증하고 코드를 디버깅하는 능력을 내장한 것이 핵심입니다.",
        "기존 생성형 모델들이 복잡한 알고리즘이나 고난도 수학 증명에서 환각 현상(Hallucination)을 보이던 것과 달리, o3는 문제를 세부 단위로 쪼개어 단계별 정합성을 스스로 검토합니다. 벤치마크 평가 결과 국제 정보올림피아드(IOI) 및 수학 올림피아드 수준의 문제에서 정답률 92.4%를 기록했습니다.",
        "특히 주목할 부분은 경제성과 응답 속도입니다. 사고 연쇄(Chain of Thought) 프로세스를 고도화하여 토큰 낭비를 기존 모델 대비 40% 줄였습니다. 이에 따라 장시간 소요되던 복잡한 데이터 분석과 대규모 코드베이스 리팩토링 작업을 실시간에 가깝게 수행할 수 있게 되었습니다.",
        "오픈AI 측은 'o3는 단순한 지능형 챗봇의 단계를 넘어 개발자와 연구자의 실질적인 자율 협업 파트너(Co-worker)가 될 것'이라며, 다음 달부터 글로벌 클라우드 인프라를 통해 엔터프라이즈 전용 API를 제공할 계획이라고 밝혔습니다."
      ],
      related_articles: [
        {
          id: "rel-1",
          title: "구글 딥마인드, 멀티모달 자율 추론 에이전트 연구 공개로 맞불",
          publisher: "MIT 테크리뷰",
          published_at: "1시간 전",
          category: "IT/테크"
        },
        {
          id: "rel-2",
          title: "실리콘밸리 스타트업계 '코딩 AI 발전으로 소프트웨어 개발 패러다임 급변'",
          publisher: "블룸버그",
          published_at: "2시간 전",
          category: "경제"
        },
        {
          id: "rel-3",
          title: "빅테크 AI 추론 경쟁 가열… 데이터센터 전력 수급 이슈 재부각",
          publisher: "전자신문",
          published_at: "3시간 전",
          category: "IT/테크"
        }
      ]
    };

    function ArticleDetailPage() {
      const [article, setArticle] = useState(articleDetailData);
      const [darkMode, setDarkMode] = useState(false);
      const [toast, setToast] = useState(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2500);
      };

      const toggleBookmark = () => {
        const next = !article.is_bookmarked;
        setArticle(prev => ({ ...prev, is_bookmarked: next }));
        showToast(next ? "✨ 북마크 보관함에 저장되었습니다." : "북마크가 해제되었습니다.");
      };

      const toggleDarkMode = () => {
        setDarkMode(!darkMode);
        if (!darkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      };

      const handleShare = () => {
        navigator.clipboard?.writeText(window.location.href);
        showToast("링크가 클립보드에 복사되었습니다.");
      };

      return (
        <div className="min-h-screen flex flex-col relative overflow-hidden bg-slate-50 dark:bg-[#0B0F19]">
          
          {/* 배경 오로라 그라데이션 글로우 */}
          <div className="absolute top-0 left-1/4 w-96 h-96 bg-purple-500/10 dark:bg-purple-600/15 rounded-full blur-3xl pointer-events-none"></div>
          <div className="absolute top-80 right-10 w-80 h-80 bg-emerald-500/10 dark:bg-emerald-600/10 rounded-full blur-3xl pointer-events-none"></div>
          <div className="absolute bottom-10 left-1/3 w-96 h-96 bg-pink-500/10 dark:bg-pink-600/10 rounded-full blur-3xl pointer-events-none"></div>

          {/* 1. 상단 글로벌 네비게이션 헤더 */}
          <header className="sticky top-0 z-30 backdrop-blur-md bg-white/75 dark:bg-[#0F172A]/75 border-b border-slate-200/80 dark:border-slate-800/80">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
              
              {/* 뒤로가기 & 로고 */}
              <div className="flex items-center gap-3">
                <button
                  onClick={() => alert("이전 피드 페이지로 돌아갑니다.")}
                  className="p-2 rounded-xl text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-all flex items-center gap-1.5 text-xs font-bold"
                  title="피드로 돌아가기"
                >
                  <Icon name="arrowLeft" className="w-4 h-4" />
                  <span className="hidden sm:inline">피드로 돌아가기</span>
                </button>

                <div className="h-4 w-px bg-slate-200 dark:bg-slate-800 mx-1"></div>

                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-violet-600 via-indigo-600 to-pink-500 flex items-center justify-center shadow-md shadow-indigo-500/25">
                    <Icon name="sparkles" className="w-4 h-4 text-white" />
                  </div>
                  <span className="font-extrabold text-base tracking-tight bg-gradient-to-r from-violet-600 via-indigo-600 to-pink-500 bg-clip-text text-transparent">
                    PulseFeed
                  </span>
                </div>
              </div>

              {/* 우측 유틸리티 버튼 */}
              <div className="flex items-center gap-2">
                <button
                  onClick={toggleBookmark}
                  className={`p-2 rounded-xl transition-all flex items-center gap-1.5 text-xs font-bold ${
                    article.is_bookmarked
                      ? "text-rose-500 bg-rose-50 dark:bg-rose-950/60"
                      : "text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800"
                  }`}
                  title="북마크"
                >
                  <Icon name="bookmark" className="w-4 h-4" fill={article.is_bookmarked ? "currentColor" : "none"} />
                  <span className="hidden sm:inline">{article.is_bookmarked ? "저장됨" : "북마크"}</span>
                </button>

                <button
                  onClick={handleShare}
                  className="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                  title="공유하기"
                >
                  <Icon name="share" className="w-4 h-4" />
                </button>

                <button
                  onClick={toggleDarkMode}
                  className="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                  title="다크 모드 전환"
                >
                  <Icon name={darkMode ? "sun" : "moon"} className="w-4 h-4" />
                </button>
              </div>

            </div>
          </header>

          {/* 2. 기사 본문 및 관련 콘텐츠 레이아웃 (2-Column Grid) */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
              
              {/* [좌측 메인: 8칸] 기사 상세 & AI 요약 박스 */}
              <div className="lg:col-span-8 space-y-6">
                
                {/* 메인 기사 카드 래퍼 */}
                <article className="relative bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl rounded-3xl border border-slate-200/80 dark:border-slate-800/80 p-6 sm:p-8 shadow-xl shadow-indigo-500/5 overflow-hidden">
                  
                  {/* 상단 시그니처 그라데이션 라인 */}
                  <div className="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-violet-600 via-indigo-600 to-pink-500"></div>

                  {/* 1. 카테고리 및 메타 정보 바 */}
                  <div className="flex flex-wrap items-center justify-between gap-3 pb-5 border-b border-slate-100 dark:border-slate-800/80">
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold px-3 py-1 rounded-full bg-gradient-to-r from-violet-500/10 to-indigo-500/10 text-violet-600 dark:text-violet-400 border border-violet-200 dark:border-violet-900/50">
                        {article.category}
                      </span>
                      <span className="text-xs font-bold text-slate-900 dark:text-slate-100">
                        {article.publisher}
                      </span>
                      <span className="text-xs text-slate-400">• {article.author}</span>
                    </div>

                    <div className="flex items-center gap-3 text-xs text-slate-400 font-medium">
                      <span className="flex items-center gap-1">
                        <Icon name="clock" className="w-3.5 h-3.5" />
                        {article.read_time}
                      </span>
                      <span>{article.time_ago}</span>
                    </div>
                  </div>

                  {/* 2. 기사 메인 타이틀 */}
                  <h1 className="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white leading-tight tracking-tight mt-5 mb-6">
                    {article.title}
                  </h1>

                  {/* 3. 🌟 Gemini AI 핵심 요약 박스 (Highlight Section) */}
                  <section className="rounded-2xl border border-violet-200 dark:border-violet-900/60 bg-gradient-to-br from-violet-50/70 via-pink-50/30 to-amber-50/40 dark:from-violet-950/40 dark:via-slate-900 dark:to-amber-950/20 p-5 sm:p-6 space-y-4 mb-8">
                    
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2 text-violet-600 dark:text-violet-400 font-extrabold text-xs uppercase tracking-wider">
                        <Icon name="sparkles" className="w-4 h-4 text-pink-500" />
                        Gemini AI 실시간 구조화 브리핑
                      </div>
                      <span className="text-[10px] font-semibold text-slate-400">Gemini 2.5 Flash 추출</span>
                    </div>

                    {/* 💡 한 줄 핵심 (core_message) */}
                    <div className="bg-white/95 dark:bg-slate-800/90 rounded-xl p-4 border-l-4 border-amber-500 shadow-sm">
                      <p className="text-xs font-bold text-amber-500 mb-1 flex items-center gap-1">
                        <span>💡 한 줄 핵심 (Core Takeaway)</span>
                      </p>
                      <p className="text-sm font-bold text-slate-900 dark:text-slate-100 leading-relaxed">
                        {article.core_message}
                      </p>
                    </div>

                    {/* 📝 3줄 요약 (summary) */}
                    <div>
                      <p className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2.5">
                        📝 3줄 구조화 요약
                      </p>
                      <ul className="space-y-2.5">
                        {article.summary.map((point, idx) => (
                          <li key={idx} className="text-xs sm:text-sm text-slate-700 dark:text-slate-300 flex items-start gap-2.5">
                            <span className="shrink-0 w-5 h-5 rounded-full bg-violet-600 text-white font-bold text-xs flex items-center justify-center mt-0.5 shadow-sm">
                              {idx + 1}
                            </span>
                            <span className="leading-relaxed font-medium">{point}</span>
                          </li>
                        ))}
                      </ul>
                    </div>

                    {/* 🏷️ 태그 목록 (tags) */}
                    <div className="pt-2 flex items-center gap-1.5 flex-wrap">
                      {article.tags.map(tag => (
                        <span key={tag} className="text-xs font-bold px-2.5 py-1 rounded-lg bg-white dark:bg-slate-800 text-violet-600 dark:text-violet-300 shadow-sm border border-violet-100 dark:border-violet-900/50 cursor-pointer hover:border-violet-400 transition-colors">
                          #{tag}
                        </span>
                      ))}
                    </div>
                  </section>

                  {/* 4. 원문 본문 텍스트 (Reader View) */}
                  <div className="space-y-5 text-sm sm:text-base text-slate-700 dark:text-slate-300 leading-relaxed">
                    <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                      기사 전문 (Full Article Content)
                    </p>
                    {article.content_paragraphs.map((p, idx) => (
                      <p key={idx} className="leading-8 font-normal text-justify">
                        {p}
                      </p>
                    ))}
                  </div>

                  {/* 5. 하단 원문 링크 아웃 액션 바 */}
                  <div className="mt-10 pt-6 border-t border-slate-100 dark:border-slate-800/80 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div className="text-xs text-slate-400">
                      발행: {article.published_at} • 저작권은 {article.publisher}에 있습니다.
                    </div>
                    <a
                      href={article.origin_url}
                      target="_blank"
                      rel="noreferrer"
                      className="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-gradient-to-r from-violet-600 via-indigo-600 to-pink-500 text-white text-xs font-bold shadow-md shadow-indigo-500/20 hover:opacity-95 transition-opacity"
                    >
                      언론사 사이트에서 원문 보기
                      <Icon name="external" className="w-3.5 h-3.5" />
                    </a>
                  </div>

                </article>
              </div>

              {/* [우측 사이드 패널: 4칸] 함께 보도된 관련 기사 및 출처 정보 */}
              <div className="lg:col-span-4 space-y-6">
                
                {/* 언론사 프로필 카드 */}
                <div className="bg-white/90 dark:bg-slate-900/90 rounded-2xl border border-slate-200/80 dark:border-slate-800/80 p-5 shadow-sm">
                  <div className="flex items-center gap-3 mb-3">
                    <div className="w-10 h-10 rounded-xl bg-slate-900 dark:bg-slate-800 text-white font-black text-sm flex items-center justify-center">
                      {article.publisher_logo}
                    </div>
                    <div>
                      <h4 className="text-sm font-bold text-slate-900 dark:text-white">{article.publisher}</h4>
                      <p className="text-[11px] text-slate-400">RSS 수집 출처 인증됨</p>
                    </div>
                  </div>
                  <p className="text-xs text-slate-500 leading-relaxed">
                    실시간 기술 동향과 글로벌 테크 산업 분석을 다루는 미디어 출처입니다.
                  </p>
                </div>

                {/* 🔗 함께 보도된 관련 기사 (related_articles) */}
                <div className="bg-white/90 dark:bg-slate-900/90 rounded-2xl border border-slate-200/80 dark:border-slate-800/80 p-5 shadow-sm space-y-4">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
                    <h3 className="text-xs font-extrabold text-slate-900 dark:text-white uppercase tracking-wider flex items-center gap-1.5">
                      <span className="text-violet-600 dark:text-violet-400">●</span> 함께 보도된 관련 기사
                    </h3>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-violet-100 dark:bg-violet-950 text-violet-600 dark:text-violet-400">
                      {article.related_articles.length}건
                    </span>
                  </div>

                  <div className="space-y-3">
                    {article.related_articles.map((item) => (
                      <div
                        key={item.id}
                        onClick={() => alert(`"${item.title}" 기사로 이동합니다.`)}
                        className="group p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 hover:bg-violet-50 dark:hover:bg-violet-950/30 border border-slate-200/60 dark:border-slate-800/60 cursor-pointer transition-all duration-150"
                      >
                        <div className="flex items-center justify-between text-[11px] text-slate-400 mb-1.5">
                          <span className="font-bold text-violet-600 dark:text-violet-400">{item.publisher}</span>
                          <span>{item.published_at}</span>
                        </div>
                        <h4 className="text-xs font-bold text-slate-800 dark:text-slate-200 group-hover:text-violet-600 dark:group-hover:text-violet-400 transition-colors line-clamp-2 leading-snug">
                          {item.title}
                        </h4>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 피드 복귀 퀵 버튼 */}
                <div className="p-4 rounded-2xl bg-gradient-to-r from-violet-600/10 via-pink-500/10 to-transparent border border-violet-200/60 dark:border-violet-900/40 text-center">
                  <p className="text-xs font-bold text-slate-700 dark:text-slate-300 mb-2">다른 소식도 둘러보시겠어요?</p>
                  <button
                    onClick={() => alert("메인 피드 화면으로 돌아갑니다.")}
                    className="w-full py-2 rounded-xl bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-xs font-bold text-violet-600 dark:text-violet-400 shadow-sm border border-slate-200 dark:border-slate-700 transition-all"
                  >
                    피드 홈으로 이동 →
                  </button>
                </div>

              </div>

            </div>
          </main>

          {/* 알림 토스트 UI */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-2.5 rounded-2xl shadow-xl text-xs font-bold flex items-center gap-2 animate-in fade-in slide-in-from-bottom-2 duration-150">
              <Icon name="sparkles" className="w-4 h-4 text-violet-400" />
              {toast}
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ArticleDetailPage />);
  </script>
</body>
</html>
