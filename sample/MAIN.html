                      className="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-bold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"
                      title="독립 상세 페이지로 이동"
                    >
                      상세 페이지 보기
                      <Icon name="arrowRight" className="w-3.5 h-3.5" />
                    </a>
                    <a
                      href={activeModal.origin_url}
                      target="_blank"
                      rel="noreferrer"
                      className="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-gradient-to-r from-violet-600 via-indigo-600 to-pink-500 text-white text-xs font-bold shadow-md shadow-indigo-500/20 hover:opacity-95 transition-opacity"
                    >
                      언론사 원문
                      <Icon name="external" className="w-3.5 h-3.5" />
                    </a>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 토스트 */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-2.5 rounded-2xl shadow-xl text-xs font-bold flex items-center gap-2">
              <Icon name="sparkles" className="w-4 h-4 text-violet-400" />
              {toast}
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<VibrantApp />);
  </script>
</body>
</html>
